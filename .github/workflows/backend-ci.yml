name: Reusable Backend CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: true
        type: string

      project-path:
        required: true
        type: string

      test-path:
        required: true
        type: string

      run-tests:
        required: true
        type: boolean

      image-name:
        required: true
        type: string

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project-path }}

      - name: Build project
        run: dotnet build ${{ inputs.project-path }} --no-restore

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: dotnet test ${{ inputs.test-path }} --no-build

  docker-build-push:
    runs-on: ubuntu-latest

    needs: build-test

    permissions:
      contents: read
      packages: write

    if: github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}